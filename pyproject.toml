[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asus-router-monitor"
version = "2.0.0"
description = "Monitor Asus router status from a trusted LAN or VPN"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Leo van der Meulen"}]
keywords = ["asus", "router", "monitoring", "network"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["requests>=2.28,<3"]

[project.optional-dependencies]
dev = [
  "mypy>=1.8",
  "pip-audit>=2.7",
  "pytest>=7.4",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/lmeulen/AsusRouterMonitor"
Repository = "https://github.com/lmeulen/AsusRouterMonitor"
Issues = "https://github.com/lmeulen/AsusRouterMonitor/issues"

[project.scripts]
asus-router-monitor = "ShowRouterInfo:main"

[tool.setuptools]
py-modules = ["ShowRouterInfo", "RouterInfo"]

[tool.setuptools.packages.find]
include = ["asus_router_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["ShowRouterInfo.py", "asus_router_monitor"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["requests"]
ignore_missing_imports = true
